name: AIFileAssistant
options:
  bundleIdPrefix: com.eastlakestudio
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "5.10"
  GENERATE_INFOPLIST_FILE: "YES"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "YES"

targets:
  AIFileCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AIFileCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.AIFileCore

  AIFileSkills:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AIFileSkills
    dependencies:
      - target: AIFileCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.AIFileSkills

  AIFileAgent:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AIFileAgent
    dependencies:
      - target: AIFileCore
      - target: AIFileSkills
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.AIFileAgent

  AIFileFinderIntegration:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AIFileFinderIntegration
    dependencies:
      - target: AIFileCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.AIFileFinderIntegration

  AIFileUI:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AIFileUI
    dependencies:
      - target: AIFileCore
      - target: AIFileSkills
      - target: AIFileAgent
      - target: AIFileFinderIntegration
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.AIFileUI

  AIFileApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/AIFileApp
    dependencies:
      - target: AIFileCore
      - target: AIFileSkills
      - target: AIFileAgent
      - target: AIFileFinderIntegration
      - target: AIFileUI
    settings:
      INFOPLIST_FILE: Support/Info.plist
      CODE_SIGN_ENTITLEMENTS: Support/AIFileApp.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.aifiles
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

  AIFileCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AIFileCoreTests
    dependencies:
      - target: AIFileCore
      - target: AIFileApp

  AIFileSkillsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AIFileSkillsTests
    dependencies:
      - target: AIFileSkills
      - target: AIFileCore
      - target: AIFileApp

  AIFileAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AIFileAgentTests
    dependencies:
      - target: AIFileAgent
      - target: AIFileCore
      - target: AIFileSkills
      - target: AIFileApp

  AIFileUITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AIFileUITests
    dependencies:
      - target: AIFileUI
      - target: AIFileCore
      - target: AIFileApp
