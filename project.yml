name: AIFileAssistant
options:
  bundleIdPrefix: com.eastlakestudio
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  developmentLanguage: zh-Hans

settings:
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  SWIFT_VERSION: "5.10"
  ARCHS: "arm64"
  VALID_ARCHS: "arm64"
  GENERATE_INFOPLIST_FILE: "YES"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  ENABLE_HARDENED_RUNTIME: "YES"
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGNING_ALLOWED: "YES"

targets:
  AIFileCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AIFileCore

  AIFileSkills:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AIFileSkills
    dependencies:
      - target: AIFileCore

  AIFileAgent:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AIFileAgent
    dependencies:
      - target: AIFileCore
      - target: AIFileSkills

  AIFileFinderIntegration:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AIFileFinderIntegration
    dependencies:
      - target: AIFileCore

  AIFileUI:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/AIFileUI
    dependencies:
      - target: AIFileCore
      - target: AIFileSkills
      - target: AIFileAgent
      - target: AIFileFinderIntegration

  AIFileApp:
    type: application
    platform: macOS
    productName: "文件魔法棒"
    sources:
      - path: Sources/AIFileApp
      - path: Support/zh-Hans.lproj/InfoPlist.strings
      - path: Support/en.lproj/InfoPlist.strings
      - path: Support/Localizable.xcstrings
    dependencies:
      - target: AIFileCore
      - target: AIFileSkills
      - target: AIFileAgent
      - target: AIFileFinderIntegration
      - target: AIFileUI
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: "文件魔法棒"
        CFBundleDisplayName: "文件魔法棒"
        CFBundleDevelopmentRegion: "zh-Hans"
        CFBundleLocalizations: [zh-Hans, en]
        LSApplicationCategoryType: "public.app-category.utilities"
        ITSAppUsesNonExemptEncryption: false
        LSUIElement: false
        NSHighResolutionCapable: true
        NSPrincipalClass: "NSApplication"
    settings:
      PRODUCT_NAME: "文件魔法棒"
      CODE_SIGN_ENTITLEMENTS: Support/AIFileApp.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.eastlakestudio.aifiles
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      ENABLE_HARDENED_RUNTIME: "YES"

  AIFileCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AIFileCoreTests
    dependencies:
      - target: AIFileCore
      - target: AIFileApp

  AIFileSkillsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AIFileSkillsTests
    dependencies:
      - target: AIFileSkills
      - target: AIFileCore
      - target: AIFileApp

  AIFileAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AIFileAgentTests
    dependencies:
      - target: AIFileAgent
      - target: AIFileCore
      - target: AIFileSkills
      - target: AIFileApp

  AIFileUITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AIFileUITests
    dependencies:
      - target: AIFileUI
      - target: AIFileCore
      - target: AIFileApp
